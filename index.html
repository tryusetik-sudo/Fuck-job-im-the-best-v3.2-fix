<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="rose" data-size="m">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Global Chat</title>
<link rel="icon" href="L.png">
<meta name="theme-color" content="#09070f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
<style>
/* ============ tokens & themes ============ */
:root{
  --bg:#09070f; --sheet:#150f20; --ink:#f7f3ff; --muted:#a79fc2;
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.1); --line:rgba(255,255,255,.11);
  --card:rgba(21,15,34,.68); --other:rgba(255,255,255,.075);
  --a1:#ff4f8b; --a2:#ff9d6c; --onacc:#fff;
  --gold:#fbbf24; --admin:#fb7185; --ok:#34d399; --warn:#f59e0b;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --blob1:#7c3aed; --blob2:#ff4f8b; --blob3:#ff9d6c; --fz:1;
  color-scheme:dark;
}
:root[data-theme="ocean"]{--bg:#050f18;--sheet:#0c1925;--a1:#16a9ff;--a2:#2ee6c5;--card:rgba(10,26,40,.68);--blob1:#0284c7;--blob2:#14b8a6;--blob3:#6366f1}
:root[data-theme="noir"]{--bg:#060606;--sheet:#14120f;--a1:#e8b84a;--a2:#f6e0a0;--onacc:#1b1400;--card:rgba(24,21,16,.72);--blob1:#78350f;--blob2:#a16207;--blob3:#44403c;--line:rgba(255,235,180,.13)}
:root[data-theme="day"]{color-scheme:light;--bg:#fff5f8;--sheet:#ffffff;--ink:#2b1631;--muted:#7b6784;--glass:rgba(255,255,255,.72);--glass2:rgba(255,255,255,.96);--line:rgba(90,40,110,.15);--card:rgba(255,255,255,.8);--other:#ffffff;--shadow:0 18px 50px rgba(150,70,130,.18);--blob1:#fbcfe8;--blob2:#fde68a;--blob3:#c4b5fd}
html[data-size="s"]{--fz:.92}
html[data-size="l"]{--fz:1.14}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Outfit","Inter","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
select option{color:#111}
:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
[hidden]{display:none!important}

/* ============ background ============ */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
  background:radial-gradient(1100px 700px at 90% -10%,color-mix(in srgb,var(--blob1) 38%,transparent),transparent 60%),radial-gradient(900px 650px at -10% 110%,color-mix(in srgb,var(--blob2) 26%,transparent),transparent 55%),var(--bg)}
#bg>i{position:absolute;width:52vmax;height:52vmax;border-radius:50%;filter:blur(100px);opacity:.32;animation:drift 28s ease-in-out infinite alternate}
#bg>i:nth-child(1){background:var(--blob1);top:-20vmax;left:-16vmax}
#bg>i:nth-child(2){background:var(--blob2);bottom:-24vmax;right:-16vmax;animation-delay:-9s;opacity:.24}
#bg>i:nth-child(3){background:var(--blob3);top:38%;left:42%;width:30vmax;height:30vmax;animation-delay:-17s;opacity:.16}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#bg::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:28px 28px;opacity:.5}
#bg::after{content:"";position:absolute;inset:0;background:url(L.png) center/min(46vmin,360px) no-repeat;opacity:.045}
#fxbg{position:absolute;inset:0;overflow:hidden}
#fxbg i{position:absolute;bottom:-40px;font-style:normal;color:var(--a1);animation:floaty linear infinite}
@keyframes floaty{to{transform:translateY(-118vh) rotate(24deg)}}
@media(prefers-reduced-motion:reduce){#bg>i,#fxbg i{animation:none}#fxbg{display:none}}

/* ============ shell ============ */
#shell{position:relative;height:100%;height:100dvh;display:flex;gap:16px;max-width:1280px;margin:0 auto}
#app{position:relative;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--card);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%)}
@media(min-width:1040px){
  #shell{padding:20px}
  #app{border-radius:36px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
}

/* header */
.bar{display:flex;align-items:center;gap:12px;flex:none;position:relative;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 12px 16px;border-bottom:1px solid var(--line);
  background:linear-gradient(110deg,color-mix(in srgb,var(--a1) 20%,transparent),transparent 62%)}
.orb{width:46px;height:46px;border-radius:50%;flex:none;position:relative;overflow:hidden;background:conic-gradient(from 200deg,var(--a1),var(--a2),var(--blob1),var(--a1));box-shadow:0 0 26px color-mix(in srgb,var(--a1) 50%,transparent)}
.orb::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--sheet);opacity:.85}
.orb img{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);object-fit:cover;border-radius:50%;z-index:2}
.hinfo{flex:1;min-width:0}
.hinfo b{display:block;font-family:"Playfair Display",Georgia,serif;font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hinfo small{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;margin-top:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.dot.on{background:var(--ok);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@media(prefers-reduced-motion:reduce){.dot.on{animation:none}}
.stack{display:flex;align-items:center;padding-left:10px}
.stack .av{margin-left:-10px;border:2px solid var(--sheet);box-shadow:none}
.stack .more{margin-left:-6px;font-size:12px;font-weight:700;color:var(--muted);padding-left:10px}
.tools{display:flex;align-items:center;gap:6px;flex:none}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--glass2);border:1px solid var(--line);color:var(--ink)}
.icon:hover{border-color:var(--a2)}
.icon.adm{background:linear-gradient(135deg,#fb7185,#f97316);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(251,113,133,.35)}
.icon.vipbtn{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3b2a00;border-color:transparent;box-shadow:0 6px 18px rgba(251,191,36,.35)}
.me{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border-radius:99px;background:var(--glass2);border:1px solid var(--line);max-width:160px}
.me:hover{border-color:var(--a2)}
.me .av{width:32px;height:32px;font-size:12px;box-shadow:none}
.me span:last-child{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(min-width:1040px){#memBtn{display:none}}
@media(max-width:620px){.stack{display:none}.me{padding:3px}.me span:last-child{display:none}.hinfo b{font-size:19px}.icon{width:36px;height:36px}.tools{gap:4px}.bar{gap:8px;padding-left:12px;padding-right:10px}}
@media(max-width:480px){.orb{display:none}}

#sbar{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);flex:none}
#sbar input{flex:1;min-width:0;padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass)}
#sbar input:focus{outline:2px solid var(--a2);outline-offset:0}
#scount{font-size:12px;color:var(--muted);white-space:nowrap}

.pin{display:flex;gap:10px;align-items:flex-start;margin:10px 14px 0;padding:10px 14px;border-radius:18px;font-size:13.5px;line-height:1.45;flex:none;border-left:3px solid var(--gold);background:linear-gradient(90deg,rgba(251,191,36,.16),var(--glass))}
.pinic{color:var(--gold);display:grid;place-items:center;padding-top:1px}
.pin span:last-child{overflow-wrap:anywhere}

/* ============ messages ============ */
#messages{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.day{align-self:center;position:sticky;top:0;z-index:2;margin:14px 0 8px;padding:5px 14px;border-radius:99px;font-size:12px;font-weight:600;color:var(--muted);background:var(--sheet);border:1px solid var(--line)}
.sys{align-self:center;margin:8px 0;padding:6px 14px;border-radius:99px;font-size:12.5px;background:var(--glass2);border:1px solid var(--line);text-align:center}
.welcome{align-self:center;max-width:540px;margin:8px 0 14px;padding:14px 18px;border-radius:22px;text-align:center;font-size:14px;line-height:1.5;background:var(--glass);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.announce{align-self:center;width:min(100%,540px);margin:12px 0;padding:16px 18px;border-radius:24px;text-align:center;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 12px 32px color-mix(in srgb,var(--a1) 40%,transparent)}
.announce .t{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.9;margin-bottom:6px;font-weight:700}
.announce .b{font-size:16px;font-weight:700;line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.empty{margin:auto;text-align:center;color:var(--muted);padding:16px 22px;border-radius:20px;font-size:14px;background:var(--glass);border:1px solid var(--line)}
.older{align-self:center;margin:6px 0 10px;padding:8px 16px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--glass2);border:1px solid var(--line)}
.older:hover{border-color:var(--a2)}

.row{display:flex;gap:9px;align-items:flex-end;max-width:100%}
.row.out{flex-direction:row-reverse}
.row.first{margin-top:12px}
.spacer{width:36px;flex:none}
.col{display:flex;flex-direction:column;min-width:0;max-width:min(78%,600px)}
.row.out .col{align-items:flex-end}
.who{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;margin:0 6px 3px;cursor:pointer}
.tag{font-size:9.5px;font-weight:800;letter-spacing:.08em;padding:2px 6px;border-radius:6px;color:#fff}
.tag.admin{background:linear-gradient(135deg,#fb7185,#f97316)}
.tag.vip{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3b2a00}
.bubble{position:relative;padding:9px 15px 6px;border-radius:24px;font-size:calc(15.5px*var(--fz));line-height:1.45;overflow-wrap:anywhere;cursor:pointer;background:var(--other);border:1px solid var(--line);box-shadow:0 3px 14px rgba(0,0,0,.14)}
.row.in .bubble{border-bottom-left-radius:8px}
.row.out .bubble{border-bottom-right-radius:8px;color:var(--onacc);border-color:transparent;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 10px 26px color-mix(in srgb,var(--a1) 36%,transparent)}
.row.grouped.in .bubble{border-top-left-radius:8px}
.row.grouped.out .bubble{border-top-right-radius:8px}
.bubble.vip{border-color:var(--gold);box-shadow:0 0 0 1px color-mix(in srgb,var(--gold) 45%,transparent),0 6px 22px color-mix(in srgb,var(--gold) 24%,transparent)}
.row.out .bubble.vip{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#3b2a00}
.bubble.admin{border-color:var(--admin);box-shadow:0 0 0 1px color-mix(in srgb,var(--admin) 55%,transparent),0 6px 22px color-mix(in srgb,var(--admin) 28%,transparent)}
.row.out .bubble.admin{background:linear-gradient(135deg,#f43f5e,#f97316);color:#fff}
.bubble.admin::before,.bubble.vip::before{content:"\2605";position:absolute;top:-10px;right:12px;font-size:15px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.bubble.admin::before{color:#fde047}
.bubble.vip::before{color:var(--gold)}
.bubble.custom{background:linear-gradient(135deg,var(--bc),color-mix(in srgb,var(--bc) 55%,#000))!important;color:#fff!important;border-color:transparent!important}
.bubble.shout{font-size:calc(19px*var(--fz));font-weight:800;text-align:center;border-width:2px;padding:14px 18px 8px}
.row:has(.bubble.shout) .col{max-width:min(92%,640px)}
.bubble.mention{box-shadow:0 0 0 2px var(--a2),0 6px 20px color-mix(in srgb,var(--a2) 30%,transparent)}
.body{white-space:pre-wrap}
.meta{font-size:10.5px;opacity:.65;text-align:end;margin-top:2px}
.lnk{color:inherit;text-decoration:underline;text-underline-offset:2px;font-weight:600}
.mention-t,.mention{font-weight:700}
.mention{color:var(--a2);background:color-mix(in srgb,var(--a2) 14%,transparent);border-radius:6px;padding:0 3px}
.row.out .mention{color:#fff;background:rgba(255,255,255,.22)}
mark{background:var(--gold);color:#1a1100;border-radius:4px;padding:0 2px}
.quote{display:flex;flex-direction:column;gap:1px;margin:0 0 6px;padding:5px 9px;border-radius:10px;border-left:3px solid var(--a2);background:rgba(0,0,0,.2);font-size:12.5px;cursor:pointer;min-width:120px}
.quote b{font-size:11.5px;color:var(--a2)}
.row.out .quote b{color:#fff}
.quote span{opacity:.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row.flash .bubble{animation:flash 1.3s}
@keyframes flash{30%{box-shadow:0 0 0 4px var(--a2)}}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin:3px 4px 0}
.chip{display:inline-flex;gap:4px;align-items:center;padding:2px 9px;border-radius:99px;font-size:12.5px;background:var(--glass2);border:1px solid var(--line)}
.chip.mine{border-color:var(--a2);background:color-mix(in srgb,var(--a2) 22%,transparent)}
.abar{display:none;flex-direction:column;align-items:stretch;gap:4px;margin:6px 2px 0;padding:6px;border-radius:20px;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);max-width:100%}
.row.open .abar{display:flex}
.abar .rr{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}
.abar .rr button{width:34px;height:34px;border-radius:50%;font-size:18px;display:grid;place-items:center}
.abar .rr button:hover{background:var(--glass2)}
.abar .aa{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.abar .ab{padding:6px 11px;border-radius:10px;font-size:12px;font-weight:700;background:var(--glass);border:1px solid var(--line)}
.abar .ab:hover{border-color:var(--a2)}
.abar .ab.bad{color:var(--admin)}

/* clean (list) message style */
body:not(.clean) .row.out>.av,body:not(.clean) .row.out>.spacer,body:not(.clean) .row.out .who{display:none}
body.clean .row.out{flex-direction:row}
body.clean .row.out .col{align-items:flex-start}
body.clean .bubble,body.clean .row.out .bubble{background:transparent!important;border-color:transparent!important;box-shadow:none!important;color:var(--ink)!important;padding:2px 6px 2px 0;border-radius:10px!important}
body.clean .bubble::before{display:none}
body.clean .bubble.mention{background:color-mix(in srgb,var(--a1) 14%,transparent)!important}
body.clean .row.out .mention{color:var(--a2);background:color-mix(in srgb,var(--a2) 14%,transparent)}
body.clean .meta{text-align:start}
body.clean .bubble.shout{background:color-mix(in srgb,var(--a1) 14%,transparent)!important}

/* ============ avatars ============ */
.av{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.35);background-size:cover;background-position:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.av.sm{width:30px;height:30px;font-size:11px}
.av.md{width:42px;height:42px;font-size:14px}
.av.xl{width:88px;height:88px;font-size:30px;border:4px solid var(--sheet)}
.av.on::after{content:"";position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--sheet)}
.av.xl.on::after{width:18px;height:18px;border-width:3px;right:2px;bottom:2px}

/* ============ composer ============ */
#jump{position:absolute;right:18px;bottom:92px;z-index:5;width:44px;height:44px;border-radius:50%;font-size:22px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transform:translateY(8px);transition:.2s}
#jump.show{opacity:1;pointer-events:auto;transform:none}
#jumpN{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:#fff;color:#111;font-size:11px;font-weight:800;display:grid;place-items:center}
#typing{height:20px;padding:0 22px;font-size:12.5px;color:var(--muted);font-style:italic;flex:none;opacity:0;transition:opacity .2s}
#typing.on{opacity:1}
#composer{flex:none;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));position:relative}
#emojis{display:none;flex-direction:column;margin-bottom:8px;border-radius:22px;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
#emojis.open{display:flex}
#etabs{display:flex;gap:4px;padding:6px 8px;border-bottom:1px solid var(--line)}
#etabs button{padding:6px 12px;border-radius:99px;font-size:12.5px;font-weight:700;color:var(--muted)}
#etabs button.on{background:linear-gradient(135deg,var(--a1),var(--a2));color:var(--onacc)}
#egrid{display:flex;flex-wrap:wrap;gap:2px;padding:8px;max-height:210px;overflow-y:auto}
#egrid button{font-size:23px;width:42px;height:42px;border-radius:12px}
#egrid button:hover{background:var(--glass2)}
#egrid .none{width:100%}
#replybar{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;margin-bottom:6px;border-radius:18px;border-left:3px solid var(--a2);background:var(--glass2)}
#replybar .rt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px}
#replybar b{font-size:12px;color:var(--a2)}
#replybar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.pill{display:flex;align-items:flex-end;gap:6px;padding:7px;border-radius:32px;background:var(--glass2);border:1px solid var(--line);box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s}
.pill:focus-within{border-color:var(--a2);box-shadow:0 0 0 4px color-mix(in srgb,var(--a2) 16%,transparent),var(--shadow)}
#emojibtn{width:42px;height:42px;border-radius:50%;font-size:22px;flex:none}
#emojibtn:hover{background:var(--glass)}
#text{flex:1;resize:none;border:0;background:transparent;padding:10px 4px;max-height:130px;min-height:42px;line-height:1.4;font-size:16px}
#text:focus{outline:none}
#text::placeholder{color:var(--muted)}
#send{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--onacc);background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 6px 18px color-mix(in srgb,var(--a1) 50%,transparent);transition:transform .15s}
#send:active{transform:scale(.92)}
#send:disabled,#text:disabled{opacity:.45;cursor:not-allowed}

/* ============ members column / drawer ============ */
#members{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);z-index:41;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;background:var(--sheet);border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
#members.open{transform:none}
@media(min-width:1040px){
  #members{position:static;transform:none;width:330px;flex:none;z-index:auto;border:1px solid var(--line);border-radius:36px;background:var(--card);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);box-shadow:var(--shadow);overflow:hidden;padding-top:0}
  #mclose{display:none}
}
.ph{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.ph .badge{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a2))}
.ph h2{margin:0;font-size:18px;letter-spacing:-.01em;flex:1}
.ph h2 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.x{width:36px;height:36px;border-radius:50%;font-size:17px;display:grid;place-items:center;flex:none}
.x:hover{background:var(--glass2)}
.msb{padding:0 16px 8px}
#mbody{flex:1;overflow-y:auto;padding:4px 14px 24px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.mh{margin:10px 4px 2px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

<script>
/* ================= Settings (all optional) ================= */
const VIP_COMMAND = "/KITO";            // type this in the chat to become VIP
const ADMIN_COMMAND = "/NARO";          // type /NARO to enter admin mode, /NARO off to leave
const ROOM_OVERRIDE = "";               // leave empty: every deployment gets its OWN private room automatically
const PRIVATE_BROKERS = [               // your own broker goes here (e.g. "wss://chat.yourdomain.com/mqtt"), used first
];
const BROKERS = PRIVATE_BROKERS.concat([ // free public servers, all used at once (the secret room id is what keeps you private)
  "wss://broker.emqx.io:8084/mqtt",
  "wss://broker-cn.emqx.io:8084/mqtt",
  "wss://broker.hivemq.com:8884/mqtt",
  "wss://test.mosquitto.org:8081"
]);
const SALT = "928b86eac0840596c67f6896";   // secret mixed into the room id: change it to jump to a brand new empty room
/* ============================================================ */

/* The room id is derived from SALT + the address this page is served from, so the same files
   published twice (another repo, another domain) end up in two completely separate chats. */
function h53(str, seed){
  let a = 0xdeadbeef ^ seed, b = 0x41c6ce57 ^ seed;
  for(let i = 0; i < str.length; i++){ const c = str.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); }
  a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
  b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);

/* ---------- networking ---------- */
function onMessage(topic, payload, ci){
  if(purgeState && topic.startsWith(LEGACY_P)){   /* admin is wiping the old public room: empty every retained topic */
    if(payload.length && clients[ci] && clients[ci].connected){ clients[ci].publish(topic, "", { retain:true, qos:1 }); purgeState.n++; }
    return;
  }
  if(!topic.startsWith(P)) return;
  const raw = payload.toString();
  const parts = topic.slice(P.length).split("/");
  const kind = parts[0];
  if(kind === "j"){ if(me.admin) ingestVisit(parts[1], raw); return; }
  if(kind === "t"){ if(me.admin) ingestTrack(parts[1], raw); return; }

  if(kind === "m"){
    const id = parts[1];
    const gone = () => { msgs.delete(id); reacts.delete(id); deleted.add(id); saveDeleted(); scheduleRender(); };
    if(!raw){ gone(); return; }
    try{
      const m = JSON.parse(raw);
      if(m && m.del){ gone(); return; }
      if(!m || (!m.type && typeof m.text !== "string")) return;
      if(deleted.has(id)) return;
      m.text = String(m.text || "").slice(0,1000);
      m.name = String(m.name || "Unknown").slice(0,24);
      m.ts = Number(m.ts) || 0; m.ev = Number(m.ev) || 0;
      if(m.re && typeof m.re === "object") m.re = { id:String(m.re.id || "").slice(0,40), n:String(m.re.n || "").slice(0,24), t:String(m.re.t || "").slice(0,120) }; else delete m.re;
      m.edited = !!m.edited; m.shout = !!m.shout; if(!/^#[0-9a-f]{6}$/i.test(m.bc || "")) delete m.bc;
      const old = msgs.get(id);
      if(old && (old.ev || 0) > m.ev){ if(ci != null && clients[ci] && clients[ci].connected) clients[ci].publish(topic, JSON.stringify(old), { retain:true, qos:1 }); return; }
      if(ci != null) seenOn[ci].add(id);
      if(m.uid && !m.type) setSeen(m.uid, m.name, m.ts, m.role === "admin" ? "a" : m.vip ? "v" : "");
      msgs.set(id, m); scheduleRender();
      if(me.admin && settings.flood && m.uid && !m.type && m.uid !== me.uid && m.role !== "admin" && !m.vip && Date.now() - m.ts < 15000) floodCheck(id, m);
    }catch(e){}
  } else if(kind === "p"){
    const uid = parts[1];
    if(!raw) peers.delete(uid);
    else { try{ const p = JSON.parse(raw); peers.set(uid, { name:String(p.name||"").slice(0,24), ts:Number(p.ts)||0, r:p.r === "a" || p.r === "v" ? p.r : "" }); }catch(e){} }
    updateStatus(); refreshPanel("people"); scheduleRenderLight();
  } else if(kind === "s"){
    const uid = parts[1]; if(raw && uid !== me.uid){ try{ const o = JSON.parse(raw); setSeen(uid, String(o.n || "").slice(0,24), o.t, o.r === "a" || o.r === "v" ? o.r : ""); refreshMembers(); }catch(e){} }
  } else if(kind === "u"){
    const uid = parts[1];
    if(!raw){ if(uid !== me.uid || profiles.has(uid)){ profiles.delete(uid); saveProfiles(); } }
    else { try{ const p = cleanProfile(JSON.parse(raw)); const o = profiles.get(uid); if(p && (!o || p.ts >= o.ts)){ profiles.set(uid, p); saveProfiles(); } }catch(e){} }
    scheduleRender(); refreshMembers(); applyMe();
  } else if(kind === "r"){
    const id = parts[1], uid = parts[2];
    let mp = reacts.get(id);
    if(!raw || !REACTS.includes(raw)){ if(mp){ mp.delete(uid); if(!mp.size) reacts.delete(id); } }
    else { if(!mp){ mp = new Map(); reacts.set(id, mp); } mp.set(uid, raw); }
    scheduleRender();
  } else if(kind === "c"){
    const sub = parts[1];
    if(sub === "typing"){
      const uid = parts[2]; if(uid === me.uid || !raw) return;
      try{ const o = JSON.parse(raw); if(Date.now() - (Number(o.ts) || 0) < 8000){ typers.set(uid, { n:String(o.n || "Someone").slice(0,24), until:Date.now() + 4500 }); updateTyping(); } }catch(e){}
      return;
    }
    if(sub === "dm" || sub === "alert" || sub === "fx" || sub === "rename" || sub === "pfreset"){ liveEvent(sub, parts[2], raw); return; }
    if(sub === "settings"){
      try{
        const s = JSON.parse(raw);
        if((Number(s.v)||0) >= settings.v){
          settings = Object.assign({}, defaults, {
            v:Number(s.v)||0, title:String(s.title||"").slice(0,40) || defaults.title, pin:String(s.pin||"").slice(0,500),
            slow:Math.max(0, Math.min(600, Number(s.slow)||0)), lock:!!s.lock,
            words:Array.isArray(s.words) ? s.words.map(w => String(w).slice(0,30)).slice(0,100) : [],
            accent:/^#[0-9a-f]{6}$/i.test(s.accent) ? s.accent : "", welcome:String(s.welcome||"").slice(0,500), nolinks:!!s.nolinks, nodupe:!!s.nodupe,
            maxlen:Math.max(20, Math.min(1000, Number(s.maxlen)||1000)), nophotos:!!s.nophotos,
            flood:Math.max(0, Math.min(30, Math.floor(Number(s.flood)) || 0))
          });
          applySettings(); applyMe();
        }
      }catch(e){}
    } else if(sub === "ban"){
      const uid = parts[2];
      if(!raw) bans.delete(uid);
      else { try{ const b = JSON.parse(raw); bans.set(uid, { type:b.type === "ban" ? "ban" : "mute", until:Number(b.until)||0, name:String(b.name||"").slice(0,24) }); }catch(e){} }
      updateComposer(); scheduleRender(); refreshPanel("people");
    } else if(sub === "vip"){
      const uid = parts[2];
      if(uid === me.uid){
        if(raw){ me.vip = true; me.granted = true; saveMe(); applyMe(); }
        else if(me.granted){ me.vip = false; me.granted = false; saveMe(); applyMe(); }
      }
    }
  }
}

/* ---------- admin: anti-flood auto-mute (runs on any admin's device that is online) ---------- */
const floodMap = new Map();
function floodCheck(id, m){
  if(activeBan(m.uid)) return;
  const now = Date.now(); let a = (floodMap.get(m.uid) || []).filter(x => now - x.t < 10000);
  if(a.some(x => x.id === id)) return;
  a.push({ id, t:now }); floodMap.set(m.uid, a);
  if(a.length > settings.flood){
    floodMap.delete(m.uid);
    a.forEach(x => deleteMsg(x.id));
    setBan(m.uid, m.name, "mute", 300000);
    publishMsg({ type:"sys", text:m.name + " was auto-muted for 5 minutes (flooding)" });
    audit("Auto-muted " + m.name + " for flooding");
  }
}

/* ---------- admin: wipe the previous public room from the servers ---------- */
let purgeState = null;
function purgeLegacy(){
  if(!connectedCount()){ toast("Not connected yet"); return; }
  if(purgeState){ toast("Already running"); return; }
  purgeState = { n:0 }; toast("Wiping the old room… keep this page open for 25 seconds");
  clients.forEach(c => { if(c.connected) c.subscribe(LEGACY_P + "#", { qos:0 }); });
  setTimeout(() => {
    clients.forEach(c => { try{ c.unsubscribe(LEGACY_P + "#"); }catch(e){} });
    const n = purgeState.n; purgeState = null; audit("Wiped old room from servers (" + n + " items)"); toast("Old room wiped: " + n + " items removed");
  }, 25000);
}

function startClient(url, idx){
  const c = mqtt.connect(url, {
    clientId:"c_" + me.uid + "_" + Math.random().toString(16).slice(2,8),
    clean:true, reconnectPeriod:3000, connectTimeout:12000,
    will:{ topic:presTopic, payload:"", retain:true, qos:0 }
  });
  c.on("connect", () => {
    seenOn[idx].clear();
    c.subscribe([P + "m/#", P + "p/#", P + "c/#", P + "r/#", P + "s/#", P + "u/#"], { qos:0 });
    c.publish(presTopic, JSON.stringify({ name:me.name, ts:Date.now(), r:rcode() }), { retain:true, qos:0 });
    c.publish(P + "s/" + me.uid, JSON.stringify({ n:me.name, t:Date.now(), r:rcode() }), { retain:true, qos:0 });
    const mp = profiles.get(me.uid); if(mp && (mp.b || mp.s || mp.se || mp.loc || mp.fe || mp.av || mp.bn)) c.publish(P + "u/" + me.uid, JSON.stringify(mp), { retain:true, qos:0 });

  c.on("close", updateStatus); c.on("offline", updateStatus); c.on("error", () => {});

}

/* ---------- rendering ---------- */
function scheduleRender(){ clearTimeout(renderT); renderT = setTimeout(render, 70); }
function canDelete(m){ return me.admin || (m.uid === me.uid && me.vip); }
function mentionsMe(m){
  const t = String(m.text || "").toLowerCase();
  return t.includes("@" + me.name.toLowerCase()) || (m.role === "admin" && /(^|\s)@everyone\b/.test(t));

function addPlain(node, s){
  if(!searchQ){ node.appendChild(document.createTextNode(s)); return; }
  const low = s.toLowerCase(); let i = 0, k;
  while((k = low.indexOf(searchQ, i)) !== -1){
    if(k > i) node.appendChild(document.createTextNode(s.slice(i, k)));
    node.appendChild(el("mark", "", s.slice(k, k + searchQ.length))); i = k + searchQ.length;
  }
  if(i < s.length) node.appendChild(document.createTextNode(s.slice(i)));
}
function richText(node, t){
  const re = /(https?:\/\/[^\s<>"']+)|(@[^\s@]{2,24})/gi; let last = 0, m;
  while((m = re.exec(t))){
    if(m.index > last) addPlain(node, t.slice(last, m.index));
    if(m[1]){ const a = el("a", "lnk", m[1]); a.href = m[1]; a.target = "_blank"; a.rel = "noopener noreferrer nofollow"; a.onclick = (e) => e.stopPropagation(); node.appendChild(a); }
    else { node.appendChild(el("span", "mention", m[2])); }
    last = m.index + m[0].length;
  }
  if(last < t.length) addPlain(node, t.slice(last));
}
function updateJump(){
  const far = box.scrollHeight - box.scrollTop - box.clientHeight > 260;
  $("jump").classList.toggle("show", far);
  const n = $("jumpN"); n.textContent = below > 0 ? String(below) : ""; n.hidden = below <= 0;

function render(){
  const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 160;
  const prevTop = box.scrollTop, prevH = box.scrollHeight;
  const all = [...msgs.entries()]
    .filter(([id, m]) => !(m.uid && isBanned(m.uid)))
    .sort((a, b) => (a[1].ts - b[1].ts) || (a[0] < b[0] ? -1 : 1));
  saveCache();

  /* new-message awareness: unread counter, mention alerts, jump badge */
  const incoming = [];
  all.forEach(([id, m]) => { if(!known.has(id)){ known.add(id); if(!firstRender && !m.type && m.uid !== me.uid && Date.now() - m.ts < 180000) incoming.push(m); } });
  if(incoming.length){
    const men = incoming.some(mentionsMe);
    if(document.hidden){ unread += incoming.length; updateTitle(); }
    else if(!nearBottom){ below += incoming.length; }
    if(document.hidden || men){ ping(); if(men && !document.hidden) toast("You were mentioned"); }
  }

  let list = all;
  if(searchQ){
    list = all.filter(([id, m]) => m.type !== "sys" && (String(m.text) + " " + String(m.name || "")).toLowerCase().includes(searchQ));
    $("scount").textContent = list.length + " found";
  } else $("scount").textContent = "";
  const hiddenN = searchQ ? 0 : Math.max(0, list.length - showCount);
  if(hiddenN) list = list.slice(-showCount);

  box.textContent = "";
  if(settings.welcome && !searchQ){ box.appendChild(el("div", "welcome", settings.welcome)); }
  if(hiddenN){ const ob = el("button", "older", "Show earlier messages (" + hiddenN + ")"); ob.onclick = () => { showCount += 300; anchorBottom = true; render(); }; box.appendChild(ob); }
  if(!list.length){
    box.appendChild(el("div", "empty", searchQ ? "No messages match your search." : connectedCount() ? "No messages yet. Say hello." : "Connecting to the chat…"));
    lastNewest = null; updateJump(); return;
  }

  let lastDay = "", prev = null;
  for(const [id, m] of list){
    const dl = dayLabel(m.ts || Date.now());
    if(dl !== lastDay){ box.appendChild(el("div", "day", dl)); lastDay = dl; prev = null; }

    if(m.type === "sys"){ box.appendChild(el("div", "sys", m.text)); prev = null; continue; }
    if(m.type === "announce"){
      const a = el("div", "announce");
      a.appendChild(el("div", "t", "Announcement"));
      a.appendChild(el("div", "b", mask(m.text)));
      box.appendChild(a); prev = null; continue;
    }

    const mine = m.uid === me.uid;
    const grouped = !!(prev && prev.uid === m.uid && (m.ts - prev.ts) < 180000);
    const row = el("div", "row " + (mine ? "out" : "in") + (grouped ? " grouped" : " first") + (openId === id ? " open" : ""));
    row.dataset.id = id;

    if(grouped) row.appendChild(el("span", "spacer"));
    else { const av = avatar(m.uid || "x", m.name); av.onclick = () => showProfile(m.uid); row.appendChild(av); }

    const col = el("div", "col");
    if(!grouped){
      const who = el("div", "who");
      const nm = el("span", "", m.name); nm.style.color = nameColor(m.uid || "x"); nm.dir = "auto"; who.appendChild(nm);
      if(m.role === "admin") who.appendChild(el("span", "tag admin", "ADMIN"));
      if(m.vip) who.appendChild(el("span", "tag vip", "VIP"));
      who.onclick = () => showProfile(m.uid);
      col.appendChild(who);
    }

    const men = !mine && mentionsMe(m);
    const bub = el("div", "bubble" + (m.role === "admin" ? " admin" : "") + (m.vip && m.role !== "admin" ? " vip" : "") + (m.shout ? " shout" : "") + (men ? " mention" : ""));
    if(m.bc && m.vip && m.role !== "admin"){ bub.style.setProperty("--bc", m.bc); bub.classList.add("custom"); }
    if(m.re){
      const q = el("div", "quote"); q.appendChild(el("b", "", m.re.n)); const qt = el("span", "", mask(m.re.t)); qt.dir = "auto"; q.appendChild(qt);
      q.onclick = (ev) => { ev.stopPropagation(); jumpTo(m.re.id); }; bub.appendChild(q);
    }
    const body = el("div", "body"); body.dir = "auto"; richText(body, mask(m.text));
    bub.appendChild(body); bub.appendChild(el("div", "meta", (m.edited ? "edited · " : "") + timeFmt(m.ts)));
    bub.onclick = (ev) => {
      if(ev.detail === 2){ toggleReact(id, "❤️"); openId = null; render(); return; }   // double tap = heart
      openId = (openId === id) ? null : id; render();
    };
    col.appendChild(bub);

    const mp = reacts.get(id);
    if(mp && mp.size){
      const counts = new Map(); mp.forEach(e => counts.set(e, (counts.get(e)||0) + 1));
      const rs = el("div", "reacts");
      counts.forEach((n, e) => {
        const chip = el("button", "chip" + (mp.get(me.uid) === e ? " mine" : ""), e + (n > 1 ? " " + n : ""));
        chip.onclick = (ev) => { ev.stopPropagation(); toggleReact(id, e); };
        rs.appendChild(chip);
      });
      col.appendChild(rs);
    }

    const bar = el("div", "abar"), rr = el("div", "rr"), aa = el("div", "aa");
    REACTS.forEach(e => { const b = el("button", "", e); b.onclick = (ev) => { ev.stopPropagation(); toggleReact(id, e); openId = null; render(); }; rr.appendChild(b); });
    const A = (label, cls, fn) => { const x = el("button", "ab " + (cls || ""), label); x.onclick = (ev) => { ev.stopPropagation(); fn(); }; aa.appendChild(x); };
    if((me.admin || me.vip) && !m.type) A("Reply", "", () => { setReply(id, m); openId = null; render(); });
    A("Copy", "", () => { try{ navigator.clipboard.writeText(m.text); toast("Copied"); }catch(e){} });
    if(m.uid) A("Profile", "", () => showProfile(m.uid));
    if(me.admin || (me.vip && m.uid === me.uid)) A("Edit", "", () => editMsg(id));
    if(me.admin){
      A("Info", "", () => toast("Sent " + fmtDT(m.ts) + " · " + String(m.uid || "").slice(0, 10)));
      A("Pin", "", () => { saveSettings({ pin:m.text.slice(0,500) }); openId = null; render(); });
      if(m.uid && m.uid !== me.uid){
        A("Mute 10m", "", () => { setBan(m.uid, m.name, "mute", 600000); openId = null; render(); });
        A("Ban", "bad", () => { if(confirm("Ban " + m.name + "?")) setBan(m.uid, m.name, "ban", 0); });
      }
    }
    if(canDelete(m)) A("Delete", "bad", () => deleteMsg(id));
    bar.appendChild(rr); bar.appendChild(aa);
    col.appendChild(bar);
    row.appendChild(col); box.appendChild(row);
    prev = m;
  }

  const newestId = list[list.length-1][0];
  const newestMine = list[list.length-1][1].uid === me.uid;
  const isNew = newestId !== lastNewest;
  if(anchorBottom){ box.scrollTop = box.scrollHeight - (prevH - prevTop); anchorBottom = false; }
  else if(firstRender || (isNew && (nearBottom || newestMine))){ box.scrollTop = box.scrollHeight; below = 0; }
  else box.scrollTop = prevTop;
  lastNewest = newestId; firstRender = false; updateJump();
}

/* ---------- sending ---------- */
let lastSend = 0, lastText = "";
function publishMsg(obj){
  const ts = Date.now();
  const id = ts.toString(36).padStart(9,"0") + Math.random().toString(36).slice(2,6);
  const m = Object.assign({ ts }, obj);
  msgs.set(id, m); scheduleRender();
  pubAll(P + "m/" + id, JSON.stringify(m));
}
function autosize(){ const t = $("text"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 130) + "px"; }
function send(){
  const input = $("text"), text = input.value.trim();
  if(!text) return;
  const clear = () => { input.value = ""; autosize(); };

  const up = text.toUpperCase();
  if(up === VIP_COMMAND.toUpperCase()){
    clear();
    if(me.vip){ toast("VIP is already active"); return; }
    me.vip = true; saveMe(); applyMe(); toast("VIP activated. Tap the gold button");
    if(connectedCount()) publishMsg({ type:"sys", text:me.name + " activated VIP" });
    return;
  }
  if(up === ADMIN_COMMAND.toUpperCase() || up === ADMIN_COMMAND.toUpperCase() + " OFF"){
    clear();
    if(up.endsWith(" OFF")){ me.admin = false; saveMe(); applyMe(); updateComposer(); closePanel(); toast("Admin mode off"); return; }
    me.admin = true; saveMe(); applyMe(); updateComposer(); subJoin(); toast("Admin mode on. Tap the shield icon");
    return;
  }

  if(!connectedCount()){ toast("Not connected yet. Retrying…"); return; }
  const r = blockReason(); if(r){ toast(r); return; }
  const now = Date.now(), priv = me.admin || me.vip;
  if(!priv && settings.slow && now - lastSend < settings.slow * 1000){
    toast("Slow mode: wait " + Math.ceil((settings.slow*1000 - (now - lastSend)) / 1000) + "s"); return;
  }
  if(!priv){
    if(settings.nolinks && /(https?:\/\/|www\.|\b[a-z0-9-]+\.(com|net|org|io|me|ly|gg|xyz|app|co)\b)/i.test(text)){ toast("Links are not allowed here"); return; }
    if(text.length > settings.maxlen){ toast("Max " + settings.maxlen + " characters per message"); return; }
    if(settings.nodupe && text === lastText && now - lastSend < 60000){ toast("Please don't repeat yourself"); return; }
  }
  lastText = text;
  if(now - lastSend < 400) return;
  lastSend = now;

  const m = { uid:me.uid, name:me.name, text:text.slice(0,1000) };
  if(me.vip) m.vip = true;
  if(me.admin) m.role = "admin";
  if(me.vip && me.bc && /^#[0-9a-f]{6}$/i.test(me.bc)) m.bc = me.bc;
  if(replyTo && priv){ m.re = { id:replyTo.id, n:replyTo.n, t:replyTo.t }; }
  clearReply();
  publishMsg(m); clear(); input.focus();
}

/* ---------- sounds, effects, popups ---------- */
function ping(){
  if(!prefs.sound) return;
  try{ const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
  o.connect(g); g.connect(a.destination); o.frequency.value = 880; g.gain.setValueAtTime(.12, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .4); o.start(); o.stop(a.currentTime + .4); }catch(e){}
}
function live(sub, uid, obj){ pubAll(P + "c/" + sub + "/" + (uid || "all"), JSON.stringify(Object.assign({ ts:Date.now(), from:me.name }, obj)), { retain:false, qos:1 }); }
function showAlert(text, from){
  ping(); const w = el("div", "alertbox"), c = el("div", "gcard");
  c.appendChild(el("h1", "", "Notice")); c.appendChild(el("p", "", from));
  const tx = el("div", "tx", text); tx.dir = "auto"; c.appendChild(tx);
  const b = el("button", "btn pri", "Got it"); b.onclick = () => w.remove(); c.appendChild(b); w.appendChild(c); document.body.appendChild(w);
}
function fx(e){
  for(let i = 0; i < 36; i++){
    const x = el("span", "fxp", e);
    x.style.cssText = "left:" + Math.random() * 100 + "vw;animation-duration:" + (2.5 + Math.random() * 2.5) + "s;animation-delay:" + Math.random() * 1.2 + "s;font-size:" + (18 + Math.random() * 22) + "px";
    document.body.appendChild(x); setTimeout(() => x.remove(), 6500);
  }
}
function liveEvent(sub, uid, raw){
  let o; try{ o = JSON.parse(raw); }catch(e){ return; }
  if(!o || Date.now() - (Number(o.ts) || 0) > 30000) return;
  const from = String(o.from || "Admin").slice(0,24), text = String(o.text || "").slice(0,300);
  if(sub === "alert" && text) return showAlert(text, "Announcement from " + from);
  if(sub === "fx") return fx(ALLOWED.has(o.e) ? o.e : "❤️");
  if(uid !== me.uid) return;
  if(sub === "dm" && text) showAlert(text, "Private message from " + from);
  if(sub === "rename"){ const n = String(o.name || "").trim().slice(0,24); if(n){ me.name = n; saveMe(); applyMe(); beat(); toast("An admin changed your name"); } }
  if(sub === "pfreset"){ profiles.delete(me.uid); store.set("chat_myprofile", "null"); saveProfiles(); applyMe(); scheduleRender(); refreshMembers(); toast("An admin reset your profile"); }
}

/* ---------- profile editor ---------- */
function pickPhoto(file, cb){
  if(!file || !/^image\//.test(file.type)){ toast("Choose an image file"); return; }
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const S = 128, c = document.createElement("canvas"); c.width = c.height = S;
      const x = c.getContext("2d"), s = Math.min(img.width, img.height) || 1, sx = (img.width - s) / 2, sy = (img.height - s) / 2;
      x.drawImage(img, sx, sy, s, s, 0, 0, S, S);
      let out = c.toDataURL("image/jpeg", .8); if(out.length > 30000) out = c.toDataURL("image/jpeg", .6);
      if(out.length < 38000) cb(out); else toast("That photo is too detailed, try another");
    };
    img.onerror = () => toast("Couldn't read that image");
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

function getTimeline(uid){
  const t = tlog[uid] || {}, on = isOnline(uid), s = seen[uid];
  let fj = t.fj || 0, lj = t.lj || 0, cc = t.cc || "", dev = "";
  visitLog.forEach(v => { if(v.uid === uid){ if(!fj || v.ts < fj) fj = v.ts; if(v.ts > lj){ lj = v.ts; dev = v.dev || dev; if(v.cc) cc = v.cc; } else if(!dev) dev = v.dev || ""; } });
  let firstMsg = 0, msgsN = 0;
  msgs.forEach(m => { if(m.uid === uid && !m.type){ msgsN++; if(!firstMsg || m.ts < firstMsg) firstMsg = m.ts; } });
  let fl = t.fl || 0, flA = false, ll = t.ll || 0, llA = false;
  if(!ll && !on && s && s.t){ ll = s.t; llA = true; }
  if(!fl && !on && s && s.t && (t.n || 0) <= 1){ fl = s.t; flA = true; }
  return { fj, fl, flA, lj, ll, llA, n:t.n || 0, msgs:msgsN, firstMsg, cc, dev };
}

}

}

/* ================= join / leave tracking & visitor log ================= */
let logKey = null;
async function getLogKey(){
  if(logKey) return logKey;
  const enc = new TextEncoder(), base = await crypto.subtle.importKey("raw", enc.encode(ROOM), "PBKDF2", false, ["deriveKey"]);
  return logKey = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:enc.encode("log:" + ROOM), iterations:60000, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
const b64 = u => btoa(String.fromCharCode(...u)), unb64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));
async function seal(o){
  if(!(window.crypto && crypto.subtle)) return JSON.stringify({ p:o });
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv }, await getLogKey(), new TextEncoder().encode(JSON.stringify(o))));
  return JSON.stringify({ iv:b64(iv), d:b64(ct) });
}
async function unseal(raw){
  try{
    const o = JSON.parse(raw); if(o.p) return o.p; if(!o.iv) return null;
    const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(o.iv) }, await getLogKey(), unb64(o.d));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ return null; }
}
async function getJSON(u){ const ac = new AbortController(), t = setTimeout(() => ac.abort(), 5000); try{ return await (await fetch(u, { signal:ac.signal })).json(); } finally{ clearTimeout(t); } }
async function detectCountry(){
  const tries = [async () => (await getJSON("https://api.country.is/")).country, async () => (await getJSON("https://ipwho.is/")).country_code, async () => (await getJSON("https://get.geojs.io/v1/ip/country.json")).country];
  for(const f of tries){ try{ const c = String(await f() || "").toUpperCase(); if(/^[A-Z]{2}$/.test(c)) return c; }catch(e){} }
  const m = (navigator.language || "").match(/-([A-Za-z]{2})$/); return m ? m[1].toUpperCase() : "";
}
function deviceInfo(){
  const u = navigator.userAgent;
  const os = /Android/i.test(u) ? "Android" : /iPhone|iPad|iPod/i.test(u) ? "iOS" : /Windows/i.test(u) ? "Windows" : /Mac OS/i.test(u) ? "macOS" : /Linux/i.test(u) ? "Linux" : "?";
  const br = /Edg\//.test(u) ? "Edge" : /OPR\/|Opera/.test(u) ? "Opera" : /Chrome\//.test(u) ? "Chrome" : /Firefox\//.test(u) ? "Firefox" : /Safari\//.test(u) ? "Safari" : "?";
  return os + " · " + br + (/Mobi/i.test(u) ? " · Mobile" : " · Desktop");
}
/* this device's own join/leave record */
let track = {}; try{ track = JSON.parse(store.get("chat_track") || "{}") || {}; }catch(e){}
const saveTrack = () => store.set("chat_track", JSON.stringify(track));
function trackStart(){
  const now = Date.now();
  if(track.open && track.la && now - track.la > 90000){ track.ll = track.la; if(!track.fl) track.fl = track.la; }   // previous visit ended without a clean exit
  if(!track.fj) track.fj = now;
  track.lj = now; track.n = (track.n || 0) + 1; track.open = true; track.la = now; saveTrack();
}
let leaveRec = null;
async function sealLeave(t){ if(!track.open) return; try{ leaveRec = await seal({ name:me.name, cc:geo.cc, fj:track.fj, fl:track.fl || t, lj:track.lj, ll:t, n:track.n, ts:t }); }catch(e){} }
function trackBeat(t){ if(track.open){ track.la = t; saveTrack(); sealLeave(t); } }
function trackLeave(){
  if(!track.open) return; const t = Date.now();
  track.open = false; track.ll = t; if(!track.fl) track.fl = t; track.la = t; saveTrack();
  if(leaveRec) pubAll(P + "t/" + me.uid, leaveRec);
}
async function publishTrack(){
  if(!track.fj) return;
  try{ const p = await seal({ name:me.name, cc:geo.cc, fj:track.fj, fl:track.fl || 0, lj:track.lj, ll:track.ll || 0, n:track.n, ts:Date.now() });
    const go = () => pubAll(P + "t/" + me.uid, p);
    if(connectedCount()) go(); else { const i = setInterval(() => { if(connectedCount()){ clearInterval(i); go(); } }, 800); }
  }catch(e){}
}
async function recordVisit(){
  geo.cc = await detectCountry();
  const n = Number(store.get("chat_visits") || 0) + 1; store.set("chat_visits", String(n));
  const rec = { name:me.name, cc:geo.cc, dev:deviceInfo(), lang:navigator.language || "", tz:(Intl.DateTimeFormat().resolvedOptions().timeZone || ""), ts:Date.now(), n };
  let payload; try{ payload = await seal(rec); }catch(e){ return; }
  const go = () => { pubAll(P + "j/" + me.uid, payload); publishTrack(); sealLeave(Date.now()); };
  if(connectedCount()) go(); else { const t = setInterval(() => { if(connectedCount()){ clearInterval(t); go(); } }, 800); }
}
function startSession(){ trackStart(); recordVisit(); }
function subJoin(){ clients.forEach(c => { if(c.connected) c.subscribe([P + "j/#", P + "t/#"], { qos:0 }); }); }

const persistLog = () => store.set("chat_vlog", JSON.stringify(visitLog));
async function ingestVisit(uid, raw){
  uid = String(uid);
  if(!raw){ visitLog = visitLog.filter(v => v.uid !== uid); persistLog(); refreshPanel("insights"); return; }
  const o = await unseal(raw); if(!o || !Number(o.ts)) return;
  const r = { uid, name:String(o.name || "").slice(0,24), cc:/^[A-Z]{2}$/.test(o.cc) ? o.cc : "", dev:String(o.dev || "").slice(0,40),
              tz:String(o.tz || "").slice(0,40), lang:String(o.lang || "").slice(0,12), ts:Number(o.ts), n:Number(o.n) || 1 };
  if(visitLog.some(v => v.uid === uid && v.ts === r.ts)) return;
  visitLog.push(r); visitLog.sort((a,b) => b.ts - a.ts); visitLog = visitLog.slice(0,800); persistLog();
  if(Date.now() - r.ts < 60000 && uid !== me.uid) toast(r.name + " (" + flag(r.cc) + ") joined the chat");
  refreshPanel("insights"); refreshPanel("people");
}
async function ingestTrack(uid, raw){
  uid = String(uid); if(!raw) return;
  const o = await unseal(raw); if(!o) return;
  const n = (x) => Number(x) || 0, c = tlog[uid] || {}, mn = (a, b) => a && b ? Math.min(a, b) : (a || b);
  tlog[uid] = { name:String(o.name || c.name || "").slice(0,24), cc:/^[A-Z]{2}$/.test(o.cc) ? o.cc : (c.cc || ""),
    fj:mn(n(o.fj), n(c.fj)), fl:mn(n(o.fl), n(c.fl)), lj:Math.max(n(o.lj), n(c.lj)), ll:Math.max(n(o.ll), n(c.ll)), n:Math.max(n(o.n), n(c.n)) };
  store.set("chat_tlog", JSON.stringify(tlog)); refreshPanel("people");
}

(function gate(){
  const g = $("gate");
  const enter = () => { const n = $("gName").value.trim(); if(n){ me.name = n.slice(0,24); saveMe(); applyMe(); }
    store.set("chat_entered", "1"); g.classList.add("out"); setTimeout(() => g.remove(), 450); startSession(); };
  $("gName").value = me.name; $("gGo").onclick = enter;
  $("gName").addEventListener("keydown", e => { if(e.key === "Enter") enter(); });
  if(store.get("chat_entered")){ g.remove(); startSession(); }
})();

window.addEventListener("pagehide", () => { pubAll(P + "s/" + me.uid, JSON.stringify({ n:me.name, t:Date.now(), r:rcode() }), { retain:true, qos:0 }); trackLeave(); });
window.addEventListener("pageshow", (e) => { if(e.persisted && !track.open && store.get("chat_entered")){ trackStart(); publishTrack(); wake(); } });

/* ================= boot ================= */
function wake(){ clients.forEach(c => { if(!c.connected) try{ c.reconnect(); }catch(e){} }); }
loadCache(); loadProfiles();
applyPrefs(); buildHearts(); buildEmojiPanel();
applyMe(); applySettings(); updateComposer();
if(typeof mqtt === "undefined"){
  $("status").textContent = "Could not load the library. Check your connection.";
} else {
  BROKERS.forEach((u, i) => startClient(u, i));
  setInterval(beat, 30000);
  setInterval(() => { updateStatus(); updateComposer(); }, 10000);
  setInterval(updateTyping, 1500);
  setTimeout(scheduleRender, 2000);
  setTimeout(heal, 12000); setTimeout(heal, 50000); setInterval(heal, 300000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden){ unread = 0; updateTitle(); wake(); } });
  window.addEventListener("online", wake);
}
try{ desktop.addEventListener("change", refreshMembers); }catch(e){ try{ desktop.addListener(refreshMembers); }catch(e2){} }
refreshMembers();
